version: "3.9"

services:
  app:
    build: .
    container_name: taskhub-app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      DATABASE_URL: "mysql://root:password@db:3306/taskhub"
    depends_on:
      - db

  db:
    image: mysql:8
    container_name: taskhub-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: taskhub
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: