openapi: 3.0.0
info:
  title: TaskHub API
  version: 1.0.0

paths:
  /api/tasks:
    get:
      summary: タスク一覧取得
      responses:
        '200':
          description: 成功
    post:
      summary: タスク作成
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                content:
                  type: string
                status:
                  type: string
                  enum: [TODO, DOING, DONE]
      responses:
        '200':
          description: 作成成功

  /api/tasks/{id}:
    put:
      summary: タスク更新
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                content:
                  type: string
                status:
                  type: string
                  enum: [TODO, DOING, DONE]
      responses:
        '200':
          description: 更新成功

    delete:
      summary: タスク削除
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 削除成功